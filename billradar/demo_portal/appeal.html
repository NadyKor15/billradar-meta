<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Health Plan - Member Appeal (SAMPLE)</title>
<!-- A made-up insurer's appeal page for the BillRadar demo. Nothing here is a real portal;
     the agent may only work on this file. Opened as file:// on a test machine, no server. -->
<style>
  :root { --ink:#1f2a33; --muted:#5d6b75; --line:#c9d2d9; --brand:#2f5d8a; --warn:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 Arial, Helvetica, sans-serif; color:var(--ink); background:#eef2f5; }
  .sample { background:var(--warn); color:#fff; text-align:center; font-weight:bold; padding:8px; letter-spacing:.04em; }
  header { background:var(--brand); color:#fff; padding:14px 28px; display:flex; justify-content:space-between; }
  header b { font-size:20px; }
  main { max-width:860px; margin:24px auto; background:#fff; border:1px solid var(--line); padding:24px 28px; }
  h1 { margin:0 0 4px; font-size:22px; }
  p.note { color:var(--muted); margin:0 0 18px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 18px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:3px; }
  input, textarea { width:100%; padding:7px 9px; font-size:15px; border:1px solid var(--line); border-radius:4px; }
  textarea { height:64px; resize:none; }
  .wide { grid-column:1 / -1; }
  .actions { margin-top:20px; display:flex; gap:12px; align-items:center; }
  button { font-size:16px; padding:10px 22px; border-radius:4px; border:1px solid var(--brand); cursor:pointer; }
  #submit { background:var(--brand); color:#fff; }
  #confirmation { display:none; margin-top:18px; padding:14px; border:2px solid #2e7d32; background:#eef7ee; }
</style>
</head>
<body>
<div class="sample">SAMPLE - FICTIONAL INSURER. Demo copy for BillRadar. Not a real portal.</div>
<header><b>Sample Health Plan</b><span>Member Portal</span></header>
<main>
  <h1>File an appeal</h1>
  <p class="note">Tell us which claim you disagree with. You can attach your letter after you submit.</p>
  <form id="appeal" autocomplete="off">
    <div class="grid">
      <div><label for="patient_name">Patient name</label><input id="patient_name" name="patient_name"></div>
      <div><label for="member_id">Member ID</label><input id="member_id" name="member_id"></div>
      <div><label for="claim_number">Claim number</label><input id="claim_number" name="claim_number"></div>
      <div><label for="service_dates">Date(s) of service</label><input id="service_dates" name="service_dates"></div>
      <div><label for="provider">Provider or hospital</label><input id="provider" name="provider"></div>
      <div><label for="denial_date">Date on the denial notice</label><input id="denial_date" name="denial_date"></div>
      <div><label for="denial_codes">Remark code(s)</label><input id="denial_codes" name="denial_codes"></div>
      <div><label for="amount">Amount in dispute ($)</label><input id="amount" name="amount"></div>
      <div class="wide"><label for="reason">Why you disagree</label><textarea id="reason" name="reason"></textarea></div>
      <div class="wide"><label for="phone">Phone</label><input id="phone" name="phone"></div>
    </div>
    <div class="actions">
      <button type="submit" id="submit">Submit appeal</button>
      <span class="note">Review every field before you submit.</span>
    </div>
  </form>
  <div id="confirmation" role="status"></div>
</main>
<script>
  document.getElementById("appeal").addEventListener("submit", function (e) {
    e.preventDefault();
    var claim = document.getElementById("claim_number").value.trim();
    var n = 0;
    for (var i = 0; i < claim.length; i++) { n = (n * 31 + claim.charCodeAt(i)) % 100000; }
    var box = document.getElementById("confirmation");
    box.textContent = "Appeal received (SAMPLE). Confirmation number SHP-APL-" + String(n).padStart(5, "0") + ".";
    box.style.display = "block";
    document.getElementById("submit").disabled = true;
  });
</script>
</body>
</html>
